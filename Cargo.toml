[package]
name = "Obsidian_Rs"
version = "1.0.8"
edition = "2021"
authors = ["Edmond NOUMEGNI << Hacker Éthique >> <https://portfolio-nine-jade-22.vercel.app/>"]
description = "Obsidian_Rs — Version 100% Rust du plugin Antigravity Obsidian Prism"
license = "GPL-3.0-only"
keywords = ["antigravity", "theme", "cdp", "optique", "rust"]

[lib]
name = "obsidian_rs"
path = "src/lib.rs"

[[bin]]
name = "obsidian_rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "3.0"
notify = "8.0"
dirs = "6.0"
sysinfo = "0.33"
sha2 = "0.10"
url = "2.5"
log = "0.4"
env_logger = "0.11"
